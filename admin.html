<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yours Tutor Admin</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#1b0d29;--g:rgba(52,26,74,.62);--b:rgba(255,255,255,.11);--pk:#ff5fa8;--gd:#f6c445;--tx:#fdf4ff;--mu:#bba6cf}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;line-height:1.55}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40rem 30rem at 85% -5%,rgba(255,95,168,.28),transparent),radial-gradient(35rem 30rem at -5% 40%,rgba(246,196,69,.13),transparent),radial-gradient(30rem 25rem at 90% 95%,rgba(124,77,255,.22),transparent)}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.hidden{display:none!important}.mu{color:var(--mu)}small{color:var(--mu);font-size:.78rem}
.glass{background:var(--g);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--b);border-radius:1.25rem}
.p{padding:1.25rem}.wrap{max-width:68rem;margin:0 auto;padding:0 1.1rem}
.btn{background:linear-gradient(135deg,#ff5fa8,#ff8ac4);color:#2a0f3d;font-weight:800;border:0;border-radius:.8rem;padding:.65rem 1.1rem;cursor:pointer;font:inherit;font-weight:800;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,95,168,.4)}
.btn.gh{background:transparent;color:var(--gd);border:1.5px solid var(--gd)}.btn.gh:hover{box-shadow:0 8px 24px rgba(246,196,69,.25)}
.btn.ok{background:#3ddc97}.btn.no{background:#ff7a7a;margin-left:.4rem}
input,select,textarea{width:100%;background:rgba(10,4,18,.5);border:1px solid var(--b);color:var(--tx);border-radius:.75rem;padding:.7rem .85rem;font:inherit}
label{display:block;font-size:.85rem;font-weight:700;margin:.8rem 0 .3rem}
nav.top{position:sticky;top:0;z-index:30;background:rgba(27,13,41,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
nav.top .wrap{display:flex;align-items:center;gap:.6rem;height:4rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;margin-right:auto}.brand img{height:2.5rem;width:2.5rem;border-radius:.6rem}
.ticker{background:rgba(246,196,69,.12);border-bottom:1px solid rgba(246,196,69,.25);overflow:hidden;white-space:nowrap;font-size:.85rem;padding:.4rem 0}
.ticker span{display:inline-block;padding-left:100%;animation:mq 28s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
.hero{display:grid;gap:2rem;align-items:center;padding:3.5rem 0 2.5rem}
@media(min-width:800px){.hero{grid-template-columns:1.15fr .85fr}}
.hero h1{font-size:clamp(2.1rem,5.5vw,3.6rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}
.hero img{width:min(21rem,80%);margin:auto;display:block;border-radius:2rem;box-shadow:0 0 90px rgba(255,95,168,.35);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.price{display:inline-block;background:rgba(246,196,69,.15);color:var(--gd);border:1px solid rgba(246,196,69,.4);padding:.3rem .8rem;border-radius:99px;font-weight:800;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}.chips span{font-size:.85rem;color:var(--mu)}.chips i{color:var(--pk);margin-right:.35rem}
section{padding:2.5rem 0}h2{font-size:1.75rem;font-weight:800;margin-bottom:.3rem}
.tab,.pill{background:transparent;color:var(--mu);border:1px solid var(--b);border-radius:99px;padding:.5rem 1rem;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--pk);color:#2a0f3d;border-color:var(--pk)}.pill.on{background:rgba(246,196,69,.16);color:var(--gd);border-color:var(--gd)}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1rem;margin-top:1.4rem;align-items:start}
.course{padding:0}.course summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:1.1rem}
.course summary::-webkit-details-marker{display:none}.course small{display:block}.course summary i{color:var(--pk);transition:transform .2s}
.course[open] summary i{transform:rotate(180deg)}.course[open]{border-color:var(--pk)}
.course ol{padding:0 1.1rem 0 2.4rem;font-size:.9rem;color:#e9d9f7}.course li{margin:.3rem 0}
.demo{margin:1rem 1.1rem 1.1rem;width:calc(100% - 2.2rem);background:rgba(246,196,69,.12);color:var(--gd);border:1px dashed var(--gd);border-radius:.8rem;padding:.7rem;font:inherit;font-weight:700;cursor:pointer}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin-top:1.2rem}
.num{font-size:1.4rem;font-weight:800;letter-spacing:.03em;margin:.2rem 0 .7rem}
.ov{position:fixed;inset:0;background:rgba(10,4,18,.82);backdrop-filter:blur(6px);display:grid;place-items:start center;z-index:50;padding:1rem;overflow:auto}
.modal{width:100%;max-width:30rem;margin-top:4vh;background:#2a1440;position:relative}.modal>.x{position:absolute;top:.8rem;right:.8rem;background:none;border:0;color:var(--mu);font-size:1.2rem;cursor:pointer}
.opts{display:flex;gap:.5rem;flex-wrap:wrap}.opts label{margin:0;flex:1;min-width:8rem;border:1px solid var(--b);border-radius:.75rem;padding:.7rem;cursor:pointer;font-weight:700}
.opts input{width:auto;margin-right:.4rem}.dots{display:flex;gap:.4rem;margin:.8rem 0}.dots i{height:.3rem;flex:1;border-radius:9px;background:var(--b)}.dots i.on{background:var(--pk)}
.rc dt{color:var(--mu);font-size:.8rem}.rc dd{font-weight:700;margin-bottom:.5rem}
#vbox iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:.8rem}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);z-index:99;background:#3ddc97;color:#10251b;font-weight:700;padding:.7rem 1.1rem;border-radius:.8rem;max-width:90vw}#toast.err{background:#ff7a7a;color:#35090f}
footer{border-top:1px solid var(--b);padding:1.6rem 0;color:var(--mu);font-size:.85rem;text-align:center}footer a{color:var(--gd);margin:0 .4rem}
/* admin */
#admin{background:var(--bg);display:block;padding:0;z-index:60}.top2{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-bottom:1px solid var(--b)}
.lay{display:grid;grid-template-columns:13rem 1fr;min-height:calc(100vh - 3.8rem)}
#anav{padding:.8rem;border-right:1px solid var(--b)}#anav button{display:flex;gap:.6rem;width:100%;background:none;border:0;color:var(--mu);padding:.6rem .7rem;border-radius:.7rem;font:inherit;font-weight:700;cursor:pointer;text-align:left}
#anav button.on{background:rgba(255,95,168,.16);color:var(--tx)}#main{padding:1.2rem;min-width:0}
@media(max-width:760px){.lay{grid-template-columns:1fr}#anav{display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--b)}#anav button{white-space:nowrap;width:auto}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem;margin-bottom:1rem}.kpi{padding:1rem}.kpi b{display:block;font-size:1.8rem;color:var(--gd)}
.bar{position:relative;margin:.6rem 0;font-size:.85rem}.bar i{display:block;height:.55rem;border-radius:9px;background:linear-gradient(90deg,var(--pk),var(--gd));margin-top:.2rem}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}.tools>*{flex:1;min-width:9rem}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.7rem}
.tag{padding:.15rem .6rem;border-radius:99px;font-size:.75rem;font-weight:800;background:rgba(246,196,69,.18);color:var(--gd)}.tag.verified{background:rgba(61,220,151,.18);color:#3ddc97}.tag.rejected{background:rgba(255,122,122,.18);color:#ff7a7a}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* course + stream section */
.sw{overflow-x:auto;scroll-snap-type:x proximity;margin-top:1rem;padding:.2rem .1rem .3rem;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}
.sw .row2{flex-wrap:nowrap;margin:0;width:max-content}
.pill{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-radius:1.1rem;font-size:.95rem;white-space:nowrap;scroll-snap-align:start;background:rgba(255,255,255,.04)}
.pill .em{font-size:1.2rem}.pill b{background:rgba(255,255,255,.12);border-radius:99px;min-width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.8rem}
.pill.on{background:linear-gradient(135deg,#ff5fa8,#ff8ac4);color:#2a0f3d;border-color:transparent;box-shadow:0 8px 22px rgba(255,95,168,.35)}.pill.on b{background:rgba(42,15,61,.18)}
.trk{height:.4rem;border-radius:9px;background:rgba(255,255,255,.1);margin:.6rem 0 0;position:relative;overflow:hidden}.trk i{position:absolute;top:0;bottom:0;left:0;width:100%;border-radius:9px;background:var(--pk)}
.course{--c:#60a5fa;border:2px solid transparent;border-radius:1.4rem;background:linear-gradient(#2b1642,#2b1642) padding-box,linear-gradient(135deg,var(--c),#a78bfa) border-box;backdrop-filter:none;-webkit-backdrop-filter:none}
.course[open]{border-color:transparent;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.course summary{gap:.9rem;padding:1.1rem}
.ct{display:flex;align-items:center;gap:.9rem;min-width:0;flex:1}
.ic{flex:none;width:3.2rem;height:3.2rem;border-radius:1rem;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ct b{display:block;font-size:1.05rem;line-height:1.25}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-top:.4rem;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.cm em{font-style:normal;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);padding:.2rem .6rem;border-radius:.5rem}
.chev{flex:none;width:.6rem;height:.6rem;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-right:.3rem;transition:transform .2s}
.course[open] .chev{transform:rotate(225deg)}
/* ===== v2 layout ===== */
.wrap{max-width:72rem}.sec{padding-top:3rem;padding-bottom:3rem}
.js .rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}.js .rv.in{opacity:1;transform:none}
.brand>span{display:flex;flex-direction:column;line-height:1.15}.brand b{font-size:.95rem;letter-spacing:.08em}.brand small{color:var(--gd);font-size:.55rem;letter-spacing:.2em;font-weight:700}
.tgl-s{display:none}@media(max-width:1023px){.tgl-l{display:none}.tgl-s{display:inline}}
.bell{position:relative;flex:none;width:2.4rem;height:2.4rem;border-radius:.8rem;border:0;background:linear-gradient(135deg,#ff5fa8,#8b5cf6);cursor:pointer;font-size:1rem}.bell i{position:absolute;top:.3rem;right:.3rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--gd)}
.nb{padding:.5rem .9rem;font-size:.9rem}
.pillbadge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:99px;border:1px solid var(--b);background:rgba(255,255,255,.05);font-size:.65rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--gd)}
.pillbadge i{width:.4rem;height:.4rem;border-radius:50%;background:var(--pk)}.live i{background:#3ddc97;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}100%{box-shadow:0 0 0 .5rem rgba(61,220,151,0)}}
.intro{text-align:center;padding-top:3rem;padding-bottom:1rem}
.intro h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:1.1rem 0 0}
.grad{background:linear-gradient(90deg,#ff5fa8,#f6c445);-webkit-background-clip:text;background-clip:text;color:transparent}
.tgl{color:var(--gd);letter-spacing:.28em;font-size:.68rem;font-weight:800;margin-top:.9rem}
.lead{max-width:40rem;margin:1rem auto 0;color:var(--mu)}.lead b{color:var(--tx)}
.cta{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;align-items:center;margin-top:1.4rem}
.cbtn{display:inline-flex;align-items:center;gap:.7rem;padding:.9rem 1.6rem;border-radius:1rem;border:2px solid transparent;color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:transform .2s,box-shadow .2s}
.c1{background:linear-gradient(#1b1030,#1b1030) padding-box,linear-gradient(135deg,#ff5fa8,#8b5cf6) border-box}.c2{background:linear-gradient(#2b1c08,#2b1c08) padding-box,linear-gradient(135deg,#f6c445,#b8860b) border-box}
.cbtn i{font-style:normal;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem}.c1 i{background:linear-gradient(135deg,#ff5fa8,#8b5cf6)}.c2 i{background:var(--gd);color:#2a1c08}
.cbtn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,95,168,.3)}.c2:hover{box-shadow:0 10px 30px rgba(246,196,69,.3)}
.lnk{background:none;border:0;color:var(--gd);text-decoration:underline;cursor:pointer;font:inherit;margin-top:1.2rem}
.sh{text-align:center;margin-bottom:1.5rem}.sh h2{font-size:clamp(1.8rem,5vw,2.6rem);margin:.7rem 0 .4rem;letter-spacing:-.02em}.sh p{max-width:36rem;margin:0 auto}
.panel{padding:1.1rem}.panel #grid{margin-top:1.2rem}
.semcards{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.semc{position:relative;display:flex;align-items:center;gap:.8rem;text-align:left;padding:.9rem 1rem;border-radius:1.1rem;border:1.5px solid var(--b);background:rgba(255,255,255,.04);color:var(--tx);font:inherit;cursor:pointer;transition:transform .2s}.semc:hover{transform:translateY(-2px)}
.semc.on{border-color:transparent;background:linear-gradient(#2b1642,#2b1642) padding-box,linear-gradient(135deg,#ff5fa8,#8b5cf6) border-box}
.semc b{display:block;line-height:1.2}.semc small{display:block}.si{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:.8rem;background:rgba(255,255,255,.08);font-size:1.3rem}
.chk{position:absolute;top:-.5rem;right:-.4rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--pk);color:#2a0f3d;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800}
@media(max-width:480px){.si{display:none}.semc{padding:.75rem}.semc b{font-size:.9rem}}
.car{display:flex;align-items:center;gap:.8rem;max-width:52rem;margin:0 auto;touch-action:pan-y}
.arw{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--gd);background:transparent;color:var(--gd);font-size:1.4rem;cursor:pointer;line-height:1}.arw:hover{background:var(--gd);color:#2a1c08}
.tc{flex:1;min-height:12rem;padding:1.6rem;border-radius:1.4rem;border:1.5px solid rgba(246,196,69,.55);background:linear-gradient(180deg,rgba(246,196,69,.1),rgba(52,26,74,.6));position:relative;opacity:0;transform:translateX(14px);transition:opacity .45s,transform .45s}.tc.in{opacity:1;transform:none}
.th{display:flex;align-items:center;gap:.9rem;padding-bottom:.9rem;border-bottom:1px solid var(--b)}
.av{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:rgba(255,255,255,.1)}
.stars{color:var(--gd);letter-spacing:.15em;font-size:.85rem}.qm{position:absolute;top:.4rem;right:1.2rem;font-size:4rem;color:rgba(246,196,69,.3);line-height:1}.tc p{margin-top:1rem;color:#efe2fa}
.tdots{display:flex;gap:.4rem;justify-content:center;margin-top:1.2rem}.tdots button{position:relative;width:.5rem;height:.5rem;border-radius:99px;border:0;background:rgba(246,196,69,.35);cursor:pointer;padding:0;transition:width .3s}.tdots button.on{width:1.6rem;background:var(--gd)}.tdots button:after{content:"";position:absolute;inset:-.5rem}
.tcount{text-align:center;font-size:.75rem;color:var(--mu);margin-top:.5rem}
@media(max-width:560px){.arw{width:2.2rem;height:2.2rem}.car{gap:.4rem}.tc{padding:1.2rem}}
.reg{position:relative;overflow:hidden;text-align:center;padding:3rem 1.4rem;border-radius:2rem;border:2px solid transparent;background:linear-gradient(#26103d,#26103d) padding-box,linear-gradient(135deg,#ff5fa8,#f6c445) border-box}
.reg:before{content:"";position:absolute;inset:0;background:radial-gradient(28rem 16rem at 10% 0%,rgba(255,95,168,.4),transparent),radial-gradient(26rem 16rem at 100% 100%,rgba(124,77,255,.45),transparent);animation:glow 8s ease-in-out infinite alternate}@keyframes glow{to{opacity:.55}}
.reg>*{position:relative}.reg h2{font-size:clamp(1.7rem,5vw,2.5rem);margin:.9rem 0 .5rem;letter-spacing:-.02em}.reg p{max-width:34rem;margin:0 auto;color:#e6d3f5}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin:1.4rem 0 .4rem}.steps div{display:flex;align-items:center;gap:.6rem;padding:.45rem 1rem .45rem .45rem;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--b);font-weight:700;font-size:.9rem}
.steps b{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--gd);color:#2a1c08;font-size:.8rem}
.ct2{text-align:center}.clogo{width:5rem;height:5rem;border-radius:1.3rem;box-shadow:0 0 40px rgba(255,95,168,.3)}.ct2 h2{margin:.8rem 0 0;font-size:clamp(1.6rem,4vw,2.2rem)}
.icons{display:flex;justify-content:center;gap:1.1rem;margin:1.3rem 0 1rem}.ibw{display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--mu);text-decoration:none;font-size:.72rem}
.ib{width:3.2rem;height:3.2rem;border-radius:1rem;border:1.5px solid var(--gd);display:grid;place-items:center;color:var(--gd);transition:.2s}.ibw:hover .ib{background:var(--gd);color:#2a1c08;transform:translateY(-3px)}.ib svg{width:1.4rem;height:1.4rem;fill:currentColor}
.msg{max-width:34rem;margin:1.4rem auto 0;text-align:left;padding:0}.msg summary{cursor:pointer;padding:1rem 1.2rem;font-weight:700}.msg form{padding:0 1.2rem 1.2rem}

/* live course deck */
.deck{--c:#c084fc;position:relative;isolation:isolate;width:min(24rem,86vw);margin:2.4rem auto 2.2rem;perspective:1200px;text-align:left}
.deck:before{content:"";position:absolute;inset:8% -8%;z-index:-1;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 45%,transparent),transparent);filter:blur(34px);transition:background 1s}
.stack{position:relative;transform-style:preserve-3d;animation:tilt 10s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotateY(-9deg) rotateX(4deg)}50%{transform:rotateY(9deg) rotateX(2deg)}}
.sb{position:absolute;inset:0;border-radius:1.5rem;border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:rgba(52,26,74,.7)}.sb1{transform:translate(.8rem,.9rem) rotate(2.5deg)}.sb2{transform:translate(1.6rem,1.8rem) rotate(5deg);opacity:.6}
.dfront{position:relative;padding:1.2rem;border-radius:1.5rem;background:linear-gradient(160deg,#3a1d55,#1f0f2f);border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 50px color-mix(in srgb,var(--c) 25%,transparent);transition:opacity .45s,transform .45s}
.dfront.out{opacity:0;transform:translateY(-16px) scale(.96)}
.dh{display:flex;align-items:center;gap:.8rem}.dh b{display:block;line-height:1.2}.dh small{display:block}
.dlive{margin-left:auto;display:flex;align-items:center;gap:.35rem;font-size:.6rem;font-weight:800;letter-spacing:.12em;color:#3ddc97}.dlive i{width:.45rem;height:.45rem;border-radius:50%;background:#3ddc97;animation:pulse 1.6s infinite}
#dL{list-style:none;padding:0;margin:1rem 0 .8rem;min-height:12.6rem}
#dL li{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;margin-bottom:.4rem;border-radius:.7rem;font-size:.85rem;color:var(--mu);background:rgba(255,255,255,.04);transition:background .4s,color .4s}
#dL li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dL em{flex:none;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--b);display:grid;place-items:center;font-style:normal;font-size:.65rem;font-weight:800;transition:background .3s}
#dL li.ok{color:var(--tx);background:color-mix(in srgb,var(--c) 18%,transparent)}#dL li.ok em{background:var(--c);border-color:var(--c);color:#2a0f3d}#dL li.ok em:after{content:"✓"}

<script>
window.sbReady=!!(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!/^YOUR_/.test(window.SUPABASE_URL));
const EM={'chart-pie':'📊','users':'👥','money-check-dollar':'💵','folder-open':'📂','bullhorn':'📣','chart-simple':'📈','bell':'🔔','user-shield':'🛡️','sliders':'⚙️','headset':'🎧','comments':'💬'};
window.sb=(sbReady&&window.supabase)?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=i=>$('#'+i).classList.remove('hidden'),hide=i=>$('#'+i).classList.add('hidden');
let tt;function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';clearTimeout(tt);tt=setTimeout(()=>t.className='hidden',3500)}
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Copied '+t));
const need=()=>sbReady||(toast('Add your Supabase keys in config.js first',1),false);

let CFG={price:499,deadline:'',hotline:'0943143416'};

/* ---- Curriculum (coursesDB) ---- */
const C={
MATH1011:["General Mathematics","Propositional Logic and Set Theory|Real and Complex Number Systems|Functions and Graphs|Polynomial and Rational Functions|Exponential and Logarithmic Functions|Analytic Geometry"],
PSCH1011:["General Psychology","Essence and Development of Psychology|Sensation and Perception|States of Consciousness|Learning and Memory|Motivation and Emotion|Personality and Psychological Disorders"],
FLEN1011:["Communicative English Skills I","Academic Listening and Note-Taking|Effective Reading Comprehension Strategies|Vocabulary Development in Context|Basic Grammatical Structures for Communication|Paragraph Writing and Structured Discourse"],
LOCT1011:["Logic and Critical Thinking","Logic and Philosophy|Basic Concepts of Logic and Arguments|Logic and Language|Informal Fallacies|Categorical Propositions and Syllogisms"],
GEES1011:["Geography of Ethiopia and the Horn","Introduction to Geography and Geology of Ethiopia|Topography, Drainage Systems, and Water Resources|Climate, Soils, and Biogeography of Ethiopia|Population, Economy, and Natural Resources of Ethiopia"],
PHYS1011:["General Physics","Kinematics and Mechanics|Dynamics and Newton's Laws|Work, Energy, and Power|Thermodynamics and Heat Transfer|Oscillations and Wave Motion"],
ECON1011:["Introductory Economics","Introduction to Economics and Scarcity|Theory of Demand and Supply|Market Structures and Pricing|Introduction to Macroeconomics and National Output"],
MATH1041:["Applied Mathematics I","Limits|Derivatives|Applications of Derivatives|Integrals"],
ECEG2052:["Computer Programming (C++)","Syntax|Control Structures|Functions|Arrays and Pointers"],
EMTE1012:["Emerging Technologies","Data Systems|AI and Machine Learning|IoT and Cloud|Blockchain and Cybersecurity"],
ANTH1012:["Social Anthropology","Anthropology and Culture|Evolution|Kinship|Indigenous Systems"],
MCIE1012:["Moral and Civic Education","Ethics|Constitution and Democracy|Patriotism"],
SNIE1012:["Inclusiveness","Disability Concepts|Inclusion Policies|Accessibility"],
MGMT1012:["Entrepreneurship","Entrepreneurship Foundations|Opportunity Identification|Business Planning"],
FLEN1012:["Communicative English Skills II","Academic Research|Technical Reports|Oral Presentations"],
CHEM2061:["General Chemistry I","Atomic Structure|Bonding|Stoichiometry|States of Matter"],
BIOL1011:["General Biology","Cell Biology|Genetics|Biodiversity|Ecology"],
GLTR2012:["Global Trends","International Relations|Foreign Policy|Globalization|Geopolitics"]};
const S1=['MATH1011','PSCH1011','FLEN1011','LOCT1011','GEES1011'],CORE=['EMTE1012','ANTH1012','MCIE1012','SNIE1012'];
const STREAMS={1:{'Natural Science':[...S1,'PHYS1011'],'Social Science':[...S1,'ECON1011']},
2:{'Pre-Engineering & Computing':['MATH1041','ECEG2052',...CORE,'MGMT1012','FLEN1012'],
'Other Natural Science':['CHEM2061','BIOL1011',...CORE,'ECON1011','FLEN1012'],
'Social Science':['GLTR2012','MGMT1012',...CORE,'FLEN1012']}};

/* ---- Admin ---- */
const MODS=[['overview','Overview','chart-pie'],['students','Students','users'],['payments','Payments','money-check-dollar'],['vault','Resource vault','folder-open'],['news','Announcements','bullhorn'],['stats','Analytics','chart-simple'],['notes','Notifications','bell'],['rbac','Roles','user-shield'],['settings','Settings','sliders'],['help','Support','headset'],['chat','Live chat','comments']];
const ROLES={'Super Admin':MODS.map(m=>m[0]),'Payment Approver':['overview','students','payments','notes','help','chat'],'Content Manager':['overview','vault','news','stats','notes']};
let role,cur='overview',F=[];const D={s:[],n:[],r:[],t:[],c:[],log:[]},CH={sel:null};
async function login(e){e.preventDefault();const b=$('#lgo'),c=$('.lcard');b.classList.add('ld');b.disabled=true;await new Promise(r=>setTimeout(r,700));
 const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});b.classList.remove('ld');b.disabled=false;
 if(error){toast(error.message,1);c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}else enter(data.user)}
function eye(){const p=$('#pw'),on=p.type=='password';p.type=on?'text':'password';$('.eye').classList.toggle('on',on)}
addEventListener('keydown',e=>{if(e.getModifierState&&e.target.closest&&e.target.closest('.lcard'))$('#caps').classList.toggle('hidden',!e.getModifierState('CapsLock'))});
async function logout(){await sb.auth.signOut();hide('dash');show('login')}
async function enter(u){role=ROLES[u.user_metadata?.role]?u.user_metadata.role:'Super Admin';hide('login');show('dash');$('#role').textContent=role;
  $('#anav').innerHTML=MODS.filter(m=>ROLES[role].includes(m[0])).map(m=>`<button id="n-${m[0]}" onclick="go('${m[0]}')"><span class="ico">${EM[m[2]]}</span>${m[1]}</button>`).join('');
  {const s=await sb.from('settings').select('*');(s.data||[]).forEach(x=>CFG[x.key]=x.key=='price'?+x.value:x.value)}await load();go('overview');
  sb.channel('live').on('postgres_changes',{event:'INSERT',schema:'public',table:'students'},p=>{D.log.unshift(`${p.new.full_name} (${p.new.student_id}) registered · ${p.new.payment_method} ${p.new.transaction_ref}`);toast('New registration: '+p.new.full_name);load().then(()=>go(cur))})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'support_tickets'},p=>{D.log.unshift(`Support ticket from ${p.new.student_name}`);toast('New support ticket');load().then(()=>go(cur))})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{if(p.new.sender=='student'){D.log.unshift('Chat: '+p.new.body.slice(0,60));toast('New chat message')}load().then(()=>{if(cur=='chat')drawChat()})}).subscribe()}
async function load(){const q=t=>sb.from(t).select('*').order('created_at',{ascending:false});
  const[s,n,r,t,c]=await Promise.all(['students','announcements','resources','support_tickets','chat_messages'].map(q));D.s=s.data||[];D.n=n.data||[];D.r=r.data||[];D.t=t.data||[];D.c=(c.data||[]).reverse()}
function go(id){cur=id;document.querySelectorAll('#anav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+id));$('#main').innerHTML=V[id]();if(id=='students')fs();if(id=='chat')drawChat()}
async function ins(t,o){const{error}=await sb.from(t).insert(o);if(error){toast(error.message,1);return false}toast('Saved');await load();go(cur);return true}
async function upd(t,id,o){const{error}=await sb.from(t).update(o).eq('id',id);error?toast(error.message,1):(toast('Updated'),await load(),go(cur))}
let st=(id,s)=>upd('students',id,{payment_status:s,notes_access_granted:s=='verified'});
const cnt=k=>D.s.reduce((a,x)=>(a[x[k]]=(a[x[k]]||0)+1,a),{});
const bars=o=>{const t=Object.values(o).reduce((a,b)=>a+b,0)||1;return Object.entries(o).map(([k,v])=>`<div class="bar">${esc(k)} <small>${v} (${Math.round(v/t*100)}%)</small><i style="width:${v/t*100}%"></i></div>`).join('')||'<p class="mu">No data yet.</p>'};
const empty=m=>`<p class="mu">${m}</p>`,codes=()=>Object.entries(C).map(([c,v])=>`<option value="${c}">${v[0]} (${c})</option>`).join('');
const V={
overview:()=>{const v=D.s.filter(x=>x.payment_status=='verified').length,p=D.s.filter(x=>x.payment_status=='pending').length;
  return `<div class="kpis">${[['Total signups',D.s.length],['Verified payments',v],['Revenue (ETB)',v*CFG.price],['Pending',p]].map(k=>`<div class="glass kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><div class="glass p"><h3>Signups by stream</h3>${bars(cnt('stream'))}</div>`},
students:()=>`<div class="tools"><input id="q" placeholder="Search name or ID, e.g. RU0897/14" oninput="fs()"><select id="fsem" onchange="fs()"><option value="">All semesters</option><option>1</option><option>2</option></select><select id="fst" onchange="fs()"><option value="">All streams</option>${[...new Set(Object.values(STREAMS).flatMap(Object.keys))].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" onclick="csv()">Export CSV</button></div><div class="glass p scroll" id="tb"></div>`,
payments:()=>D.s.filter(x=>x.payment_status=='pending').map(x=>`<div class="glass p row"><div><b>${esc(x.full_name)}</b> <small>${esc(x.student_id)} · ${x.payment_method}</small><br>Ref <code>${esc(x.transaction_ref)}</code>${x.proof_path?` <button class="btn gh" style="padding:.25rem .7rem" onclick="proofOf('${esc(x.proof_path)}')">View screenshot</button>`:' <small>No screenshot</small>'}</div><div><button class="btn ok" onclick="st('${x.id}','verified')">Verify</button><button class="btn no" onclick="st('${x.id}','rejected')">Reject</button></div></div>`).join('')||empty('No payments are waiting for review.'),
